data:
  dataset_dir: ""            # required: path to YOLO dataset directory
  negative_ratio: 0.2        # target ratio negatives / positives in train split
  min_gap_frames: 5          # minimum frame-index gap at each train/val boundary

classes:
  mapping: {}                # target_class -> coco_class or [coco_class1, coco_class2, ...]
  # examples:
  #   "person": "person"
  #   "vehicle": ["car", "truck", "bus"]

cv:
  n_folds: 3

grid_search:
  models:
    - yolo11s
    - yolo11m
    - yolo11l
  # Fixed baseline hyperparameters used for model comparison in Phase 1.
  # These are not searched — they exist only to produce a fair, comparable
  # signal across architectures before Phase 2 optimises the full recipe.
  baseline:
    epochs: 20
    freeze: partial_backbone
    lr0: 0.01
  freeze_bn: auto              # true | false | auto
  freeze_bn_auto_threshold: 100  # auto: freeze_bn=True if n_train_images < threshold

bayesian_search:
  n_trials: 150
  epochs: [5, 35]              # int range for suggest_int
  freeze:                      # categorical options
    - full_backbone
    - partial_backbone
    - early_only
    - full_finetune
  lr0: [1.0e-4, 1.0e-2]       # log-scale float range
  geometry:
    perspective: [0.0, 0.003]
    scale: [0.1, 0.5]
    translate: [0.0, 0.2]
    rotation: [0.0, 10.0]

scoring:
  metric: map50              # map50 | map
  cv_mean_weight: 0.5
  cv_std_weight: 0.2         # penalty term — higher std is worse
  robustness_weight: 0.2

augmentations:
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  fliplr: 0.5
  flipud: 0.0

robustness_probes:
  perspective_warp: true
  crop: true
  blur: true
  compression: true
  brightness_shift: true
  scale_perturbation: true

export:
  format: onnx
  output_dir: ./output

compute:
  device: "0"               # cuda device index or "cpu"
  workers: 4
  batch: 16
  imgsz: 640
  seed: 42                  # global RNG seed for training, Optuna, and run_id derivation

logging:
  verbose: false
  save_dir: ./runs
